name: Compile Screensaver

on:
  workflow_dispatch:

jobs:
  build:
    # Utilisation d'une image Windows spécifique contenant les outils nécessaires
    runs-on: windows-2019

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      working-directory: ./CountdownScreensaver
      run: nuget restore CountdownScreensaver.sln

    - name: Compile Application
      working-directory: ./CountdownScreensaver
      run: |
        msbuild CountdownScreensaver.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Prepare Screen Saver File
      shell: powershell
      run: |
        $exePath = Get-ChildItem -Path .\* -Filter CountdownScreensaver.exe -Recurse | Select-Object -First 1
        if ($exePath) {
            Copy-Item $exePath.FullName ".\CountdownScreensaver.scr"
        } else {
            Write-Error "Fichier exécutable introuvable."
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: screensaver-executable
        path: CountdownScreensaver.scr
