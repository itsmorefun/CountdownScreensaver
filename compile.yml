name: Compile Screensaver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile Application
      run: |
        msbuild CountdownScreensaver.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Prepare Screen Saver File
      shell: powershell
      run: |
        # Recherche l'exécutable généré et le renomme en .scr
        $exePath = Get-ChildItem -Path .\* -Filter CountdownScreensaver.exe -Recurse | Select-Object -First 1
        if ($exePath) {
            Copy-Item $exePath.FullName ".\CountdownScreensaver.scr"
        } else {
            Write-Error "Fichier exécutable introuvable."
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: screensaver-executable
        path: CountdownScreensaver.scr
